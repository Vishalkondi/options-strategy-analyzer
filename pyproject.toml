[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-strategy-analyzer"
version = "0.1.0"
description = "Real-time options strategy analysis and backtesting system"
requires-python = ">=3.10"

authors = [
    { name = "Options Strategy Analyzer Contributors" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "duckdb>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "kiteconnect>=5.0,<6.0",
]

# ---------------------------------------------------------
# SETUPTOOLS
# ---------------------------------------------------------
# Prevent setuptools from trying to package frontend/data/tests
# as Python packages when building the project on Vercel.

[tool.setuptools.packages.find]
where = ["."]
include = [
    "server*",
    "strategies*",
]
exclude = [
    "tests*",
    "frontend*",
    "data*",
]

# ---------------------------------------------------------
# BLACK
# ---------------------------------------------------------

[tool.black]
line-length = 100
target-version = [
    "py310",
    "py311",
    "py312",
]

include = '\.pyi?$'

extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

# ---------------------------------------------------------
# RUFF
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "RUF",
]

ignore = [
    "E501",
    "W191",
]

[tool.ruff.lint.isort]
known-first-party = [
    "server",
    "strategies",
]

known-third-party = [
    "fastapi",
    "pydantic",
    "pandas",
    "duckdb",
    "yaml",
    "kiteconnect",
]

# ---------------------------------------------------------
# MYPY
# ---------------------------------------------------------

[tool.mypy]
python_version = "3.10"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

exclude = [
    "tests/",
    "build/",
    "dist/",
    "node_modules/",
]

[[tool.mypy.overrides]]
module = [
    "kiteconnect.*",
    "duckdb.*",
    "yaml.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------
# PYTEST
# ---------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = "-v --tb=short --strict-markers"

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "live: Tests requiring live API access",
]

# ---------------------------------------------------------
# VERCEL
# ---------------------------------------------------------
# FastAPI application entrypoint:
# server/main.py -> app

[tool.vercel]
entrypoint = "server.main:app"